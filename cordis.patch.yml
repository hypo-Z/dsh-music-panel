# dsh-music-panel: local music library + sidebar player.
# `config.roots` seeds the library before the settings page saves anything;
# values saved from the settings page take precedence over this seed.
- insert:
    - id: music
      name: dsh-music-panel
      config:
        roots: []
        depth: 4
        extensions: []
        # 在线音频缓存上限（字节）：2 GiB。超过后按 LRU 淘汰到 90%。
        cacheMaxBytes: 2147483648
